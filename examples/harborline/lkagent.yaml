# lookml-agentops config (v2) for the Harborline Supply Co. demo.
# Paths are relative to this file. Nothing here assumes a topology: projects may import zero or
# many other projects. In real deployments each LookML project is usually its own git repo;
# point `projects.<name>.path` at separate checkouts.
version: 2
name: harborline
as_of: 2026-01-20          # pins relative dates ("last quarter") for deterministic answers

seed:
  seed: 20260120
  scale: 1.0
  out_dir: seed/data
  duckdb: seed/harborline.duckdb
  manifest: seed/manifest.json

projects:                  # input ids: lookml:<name>
  core_project: {path: projects/core_project}
  finance_project: {path: projects/finance_project}          # imports core_project
  logistics_project: {path: projects/logistics_project}      # imports core_project
  procurement_project: {path: projects/procurement_project}  # standalone

agents:                    # input ids: agent:<agent id from frontmatter>
  paths: ["agents/**/*.agent.md"]

catalogs:                  # input ids: catalog:<name>
  glossary: {adapter: yaml, path: catalog/glossary.yaml}

suites:                    # input ids: suite:<name>
  finance: suites/finance.yaml
  logistics: suites/logistics.yaml
  procurement: suites/procurement.yaml

owners: owners.yaml

lint:
  max_ai_fields: 150

build:
  out_dir: build

diagnose:
  runner: mock
  scenario: baseline
  history: .lkagent/history.duckdb
