# Golden questions for the finance agent. Ground truth is computed from raw seed tables by the
# SQL files in sql/, never from Looker. Relative dates resolve against lkagent.yaml `as_of`.
version: 1
tests:
  - id: fin-001
    question: "What was net revenue last quarter?"
    spoke: finance_spoke
    expect:
      explore: finance_orders
      fields_any_of: [[orders.net_revenue]]
      filters:
        - {field: orders.created_date, period: last_completed_fiscal_quarter}
      ground_truth_sql: sql/fin-001.sql
      tolerance: {relative: 0.000001}
    tags: [trap:fiscal-calendar, trap:late-refunds, trap:test-accounts, trap:soft-delete]

  - id: fin-002
    question: "What was revenue last quarter?"
    spoke: finance_spoke
    expect:
      explore: finance_orders
