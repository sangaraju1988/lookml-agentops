tests:
- agent: finance-analyst
  expect:
    explore: finance_orders
    fields_any_of:
    - - regions.region_name
      - orders.net_revenue
  id: adh.finance-analyst.golden.gq-net-rev-region
  kind: adherence
  question: What was net revenue by region in FY2026-Q3?
  rule_ids:
  - golden:gq-net-rev-region
  tags:
  - spec:golden-query
- agent: finance-analyst
  expect:
    explore: finance_invoices
    fields_any_of:
    - - invoice_fiscal.fiscal_quarter_label
      - invoices.recognized_revenue
  id: adh.finance-analyst.golden.gq-recognized-by-quarter
  kind: adherence
  question: Show recognized revenue by fiscal quarter
  rule_ids:
  - golden:gq-recognized-by-quarter
  tags:
  - spec:golden-query
