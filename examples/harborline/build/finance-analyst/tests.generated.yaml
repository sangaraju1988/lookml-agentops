- agent: finance-analyst
  expect:
    context_rules:
    - exclude-test-accounts
  id: adh.finance-analyst.rule.exclude-test-accounts
  kind: adherence
  question: (context check) Is rule exclude-test-accounts in the agent's instructions?
  rule_ids:
  - rule:exclude-test-accounts
  tags:
  - spec:rule-presence
- agent: finance-analyst
  expect:
    explore: finance_orders
    filters:
    - field: orders.created_date
      period: last_completed_fiscal_quarter
