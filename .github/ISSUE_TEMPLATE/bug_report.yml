name: Bug report
description: Something in lkagent does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not paste credentials, customer data or row-level query results**.
        Anonymize LookML and specs to the smallest example that reproduces the problem.
  - type: input
    id: version
    attributes:
      label: lkagent version
      description: Output of `lkagent version`
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: lkagent diagnose why run-0003 run-0004
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small LookML project / agent spec / suite, or steps against the Harborline example.
  - type: dropdown
    id: runner
    attributes:
      label: Runner
      options: [mock, ca, mcp, not relevant]
