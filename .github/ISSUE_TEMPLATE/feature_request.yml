name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: api
    attributes:
      label: Vendor APIs
      options:
        - label: This touches the Conversational Analytics API, Looker API, MCP or Dataplex (link the doc that confirms the fields)
