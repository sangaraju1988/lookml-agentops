# Agent-integrity gate for pull requests touching LookML, agent specs, the glossary or suites.
# generate lint (SARIF) -> generate compile --check -> diagnose impact -> diagnose run -> PR comment.
name: pr
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  security-events: write
concurrency:
  group: lkagent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  LKAGENT_CONFIG: examples/harborline
jobs:
  agentops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diagnose impact needs the base ref
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Lint LookML and agent specs
        id: lint
        run: |
          set +e
          uv run lkagent generate lint -c "$LKAGENT_CONFIG" -f sarif -o lkagent.sarif
          echo "code=$?" >> "$GITHUB_OUTPUT"
          uv run lkagent generate lint -c "$LKAGENT_CONFIG" -f markdown -o lint.md
          exit 0

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('lkagent.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: lkagent.sarif
          category: lkagent

      - name: Compile (fail if committed build/ is stale)
        run: uv run lkagent generate compile -c "$LKAGENT_CONFIG" --check

      - name: Seed synthetic warehouse
        run: uv run lkagent seed -c "$LKAGENT_CONFIG"

      - name: Impact of this PR
        run: |
          uv run lkagent diagnose impact -c "$LKAGENT_CONFIG" \
            --base "origin/${{ github.event.pull_request.base.ref }}" | tee impact.txt

      - name: Diagnose (MockRunner)
        id: run
        run: |
          set +e
          uv run lkagent diagnose run -c "$LKAGENT_CONFIG" --label "PR #${{ github.event.pull_request.number }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build report
        if: always()
        run: |
          mkdir -p reports
          uv run lkagent diagnose report -c "$LKAGENT_CONFIG" --out-dir reports || echo "_no run recorded_" > reports/report.md
          { printf '\n<details><summary>Impact</summary>\n\n```\n'; cat impact.txt 2>/dev/null; printf '```\n</details>\n\n'; cat lint.md 2>/dev/null; } >> reports/report.md

      - name: Comment on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file reports/report.md --edit-last \
            || gh pr comment "$PR" --body-file reports/report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lkagent-report
          path: reports/

      - name: Gate
        if: always()
        run: |
          [ "${{ steps.lint.outputs.code }}" = "0" ] || { echo "::error::lint errors"; exit 1; }
          [ "${{ steps.run.outputs.code }}" = "0" ] || { echo "::error::failing tests"; exit 1; }
