[project]
name = "lookml-agentops"
version = "0.3.0"
description = "Treat Looker AI-agent instructions and answer correctness as code: lint, compile, verify, attribute, report."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "lookml-agentops contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Database",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "lkml>=1.3.4",
  "duckdb>=1.0",
  "faker>=25",
  "numpy>=1.26",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/sangaraju1988/lookml-agentops"
Issues = "https://github.com/sangaraju1988/lookml-agentops/issues"

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20"]
ca = ["httpx>=0.27"]
mcp = ["mcp>=2.2"]

[project.scripts]
lkagent = "lookml_agentops.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookml_agentops"]
# ship the Harborline example so `pip install lookml-agentops && lkagent demo` works offline
exclude = ["**/seed/data/**", "**/*.duckdb", "**/*.duckdb.wal", "**/.lkagent/**", "**/reports/**"]

[tool.hatch.build.targets.wheel.force-include]
"examples/harborline" = "lookml_agentops/examples/harborline"

[tool.hatch.build.targets.sdist]
exclude = ["**/seed/data/**", "**/*.duckdb", "**/*.duckdb.wal", "**/.lkagent/**", "**/reports/**", "lkagent-demo/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "E501"]

[tool.mypy]
strict = true
files = ["src/lookml_agentops"]

[[tool.mypy.overrides]]
module = ["lkml", "lkml.*", "faker", "faker.*", "google.*", "mcp", "mcp.*", "httpx", "httpx2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: slower integration tests"]
